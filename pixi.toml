[workspace]
authors = ["David Jones <d.t.jones@outlook.com>"]
channels = ["conda-forge"]
name = "assetgen"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# Scripts run as modules from the repo root (`python -m <generator>.scripts.<name>`), so
# they import shared code as packages (`common.gltf_io`, `textures.scripts.tex_core`).
# Outputs into the game go through `common/paths.py` (`GAME3D_DIR` overrides ../game3d).
# --disable-dynamic-vram: ComfyUI 0.45's dynamic VRAM (comfy_aimdo) segfaults freeing a buffer after a CHORD run.
comfyui = { cmd = "python main.py --listen 127.0.0.1 --disable-dynamic-vram", cwd = "tools/ComfyUI" }
silhouettes = "python -m foliage.scripts.generate_silhouette"
blades = "python -m foliage.scripts.generate_geometry"
# Undergrowth plants (fern, flower, heather, scrub) -> ../game3d/assets/meshes/plants/
plants = "python -m foliage.scripts.generate_plants"
rocks = "python -m rocks.scripts.generate_rocks"
# Trees: meshes, atlases, impostors, manifest -> ../game3d/assets/trees/
trees = "python -m trees.scripts.generate_trees"
# Tileable PBR material candidates (FLUX.2 klein photo -> CHORD maps) with a lit preview -> textures/out/mat/
material = "python -m textures.scripts.gen_material"
# The older StableMaterials generator -> textures/out/sm/
material-sm = "python -m textures.scripts.gen_material_sm"
preview-foliage = { cmd = "python -m http.server 8000", cwd = "foliage/preview" }
# Rock preview: open http://localhost:8001/ (meshes/ is symlinked into preview/).
preview-rocks = { cmd = "python -m http.server 8001", cwd = "rocks/preview" }
# Foliage studio: live blade/tuft editor backed by the Python generator.
# Open http://localhost:8000/preview/studio.html
studio = "python -m foliage.scripts.serve"
# Creatures: concept -> TRELLIS.2 mesh -> rig + walk/idle -> check -> game. `pixi run creature --help`.
creature = "python -m creatures.scripts.creature"
# Props: concept -> TRELLIS.2 mesh -> frame (scale, ground, check) -> game. `pixi run prop --help`.
prop = "python -m props.scripts.prop"
# Concepts: photograph a site in the running game, draw a structure there. `pixi run concept --help`.
concept = "python -m concepts.scripts.concept"
# Paint a blockout: pictures of a build in the game, repainted as the finished place. `pixi run paint --help`.
paint = "python -m concepts.scripts.paint"
# A building's materials from its painting, through matdex (../matdex). `pixi run looks --help`.
looks = "python -m concepts.scripts.looks"

[dependencies]
python = "3.12.*"
pip = "*"
matplotlib = "*"

[pypi-dependencies]
torch = { version = ">=2.14", index = "https://download.pytorch.org/whl/cu130" }
torchvision = { version = "*", index = "https://download.pytorch.org/whl/cu130" }
torchaudio = { version = "*", index = "https://download.pytorch.org/whl/cu130" }
