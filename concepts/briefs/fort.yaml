# A fort. A brief is what to draw on a site; `concepts/scripts/concept.py` reads only
# the keys below. Edit freely, or copy it for a build of your own and pass the copy's path.

# What to draw: what it is for, how big, and how it came to be, not a list of parts. Say its
# size in metres, from the fort's role in the builder's programme
# (`../game3d/agents/builder/programmes/fort.toml`): the model has no other way to know the
# scale. This default is a pass fort. A list of parts ("a wall, one gate, a tower at each corner") is drawn as listed and
# nothing more, and only purpose ("built on the rock, hard to take") still gives a bare ring
# of wall. A history ("an old tower first, then walls, then ...") gives a fort with a keep,
# a gatehouse, timber and sheds (sampled 2026-11-24 on the col).
subject: >-
  a weathered fantasy fort that holds this mountain pass, about 120 metres across, for a
  garrison of a hundred and fifty. It has grown over generations: an old stone keep on the
  high ground first, then a wall across the pass from bank to bank, then a great gatehouse
  between two towers where the road comes in, then barracks, a hall, stables and stores,
  timber hoardings and repairs. Every part sits where the ground made it easy or useful

# How it should look. This is the house style; change it here to change every concept.
style: >-
  Rough stone quarried from the rocks in the picture, with some timber, weathered and
  patched over many years. Fitted to the ground as it lies. The same light, colours and
  rendering as the rest of the picture.

# The prompt. Picture 1 is the site photo; `{subject}` and `{style}` are filled in from above.
prompt: >-
  Add {subject} to Picture 1, standing in the middle of the picture. {style}
  Keep the land, the mountains, the rocks, the camera and the sunlight exactly as they are.

# Views of `site.shots` to draw on: approach, north, east, south, west, above, inside. Each
# view is drawn on its own, so each is its own design of the fort. The low and side views
# work; from above the photo is mostly grass, and the model invents a new camera.
views: [approach, south]
seeds: [0, 1]
