<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Foliage preview</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #202020; }
    canvas { display: block; }
    #hud {
      position: fixed; top: 12px; left: 12px;
      font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: white;
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 12px; border-radius: 4px;
      user-select: none; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div>drag: orbit &nbsp;·&nbsp; scroll: zoom &nbsp;·&nbsp; right-drag: pan</div>
    <div id="counters"></div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // Tunable — nudge if scale/density feels wrong.
    const GROUND_SIZE = 40;         // world units, ground plane extent
    const GROUND_REPEAT = 12;       // times to tile the ground texture across GROUND_SIZE
    const BILLBOARD_COUNT = 10000;
    const BILLBOARD_HEIGHT = 0.8;   // roughly the height of a real grass tuft in world units
    const CAMERA_START = [0, 2.5, 12];
    const CAMERA_TARGET = [0, 0.6, 0];

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x94b8c8);
    scene.fog = new THREE.Fog(0x94b8c8, 22, 65);

    const camera = new THREE.PerspectiveCamera(
      55, window.innerWidth / window.innerHeight, 0.1, 500
    );
    camera.position.set(...CAMERA_START);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(...CAMERA_TARGET);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI * 0.49;  // keep camera above the ground

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const sun = new THREE.DirectionalLight(0xffe8c0, 0.6);
    sun.position.set(8, 15, 5);
    scene.add(sun);

    function loadTexture(url) {
      return new Promise((resolve, reject) => {
        new THREE.TextureLoader().load(url, (tex) => {
          tex.colorSpace = THREE.SRGBColorSpace;
          resolve(tex);
        }, undefined, reject);
      });
    }

    const [groundTex, broadleafTex, seedgrassTex, denseTuftTex] = await Promise.all([
      loadTexture('assets/ground.png'),
      loadTexture('assets/billboard_broadleaf.png'),
      loadTexture('assets/billboard_seed_grass.png'),
      loadTexture('assets/billboard_dense_tuft.png'),
    ]);

    groundTex.wrapS = groundTex.wrapT = THREE.RepeatWrapping;
    groundTex.repeat.set(GROUND_REPEAT, GROUND_REPEAT);
    groundTex.anisotropy = renderer.capabilities.getMaxAnisotropy();

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE),
      new THREE.MeshStandardMaterial({ map: groundTex, roughness: 0.9, metalness: 0.0 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // Swap this to compare variants: broadleafTex, seedgrassTex, denseTuftTex.
    const activeTex = denseTuftTex;
    const variant = {
      aspect: activeTex.image.width / activeTex.image.height,
      // MeshBasicMaterial + DoubleSide so cross-quad planes render from any angle
      // without needing a face-camera pass. Baked lighting in the texture drives
      // the shading (billboards don't respond to scene lights, which is fine —
      // they already have their own baked light direction).
      material: new THREE.MeshBasicMaterial({
        map: activeTex,
        transparent: true,
        alphaTest: 0.3,
        side: THREE.DoubleSide,
      }),
    };

    // InstancedMesh: two of them, one per cross-quad orientation. Every billboard
    // is one instance in each mesh, so the whole field is 2 draw calls total —
    // regardless of BILLBOARD_COUNT. The previous Group-per-instance approach was
    // CPU-bound at ~3000 (6000 draw calls each frame). This scales to tens of
    // thousands comfortably.
    const unitPlane = new THREE.PlaneGeometry(1, 1);
    const meshA = new THREE.InstancedMesh(unitPlane, variant.material, BILLBOARD_COUNT);
    const meshB = new THREE.InstancedMesh(unitPlane, variant.material, BILLBOARD_COUNT);
    // Skip frustum culling — the instanced-mesh bounding sphere reflects only the
    // unit plane at origin, so culling would drop the whole field once the camera
    // can't see (0,0,0). Cheap to just always render.
    meshA.frustumCulled = false;
    meshB.frustumCulled = false;
    scene.add(meshA, meshB);

    const dummy = new THREE.Object3D();
    for (let i = 0; i < BILLBOARD_COUNT; i++) {
      const height = BILLBOARD_HEIGHT * (0.75 + Math.random() * 0.5);
      const width = height * variant.aspect;
      const rotY = Math.random() * Math.PI * 2;
      const x = (Math.random() - 0.5) * GROUND_SIZE * 0.9;
      const z = (Math.random() - 0.5) * GROUND_SIZE * 0.9;

      dummy.position.set(x, height / 2, z);
      dummy.rotation.set(0, rotY, 0);
      dummy.scale.set(width, height, 1);
      dummy.updateMatrix();
      meshA.setMatrixAt(i, dummy.matrix);

      dummy.rotation.set(0, rotY + Math.PI / 2, 0);
      dummy.updateMatrix();
      meshB.setMatrixAt(i, dummy.matrix);
    }
    meshA.instanceMatrix.needsUpdate = true;
    meshB.instanceMatrix.needsUpdate = true;

    document.getElementById('counters').textContent =
      `${BILLBOARD_COUNT} cross-quad billboards (instanced · 2 draw calls) · 1 variant`;

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
