# Buttress: a tall block of bedded rock, the kind that stands out of a cliff
# face between gullies. Placed half sunk into steep ground by game3d
# (`src/crags.rs`), where it breaks the smooth slope into steps and shadows.
# See rock_core.RockParams for the fields.

subdivisions: 4
# Also bake a coarse copy for distant cliffs (see `lods` in generate_rocks.py).
lods: [2]

displace_amp: 0.22
displace_freq: 1.3
displace_octaves: 3

# About as tall as it is wide.
ellipsoid_min: 0.80
ellipsoid_max: 1.25
ellipsoid_y_min: 0.95
ellipsoid_y_max: 1.35

# Many uneven beds with deep steps.
strata: 8
strata_depth: 0.30
strata_tilt: 0.10

roughen_amp: 0.0

# Joints: several near-vertical faces square it off into blocks.
side_cuts: 5
cut_offset_min: 0.62
cut_offset_max: 0.90

# Cut through the middle: widest at the base, so it never overhangs the slope
# it is sunk into.
base_tilt: 0.04
base_offset_min: 0.0
base_offset_max: 0.08

seeds: [0, 1, 2, 3]
