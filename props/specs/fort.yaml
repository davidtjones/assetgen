# A plain stone fort: the first structure kit (GAM-34). Pieces are made by code
# (props/scripts/kit.py); this spec picks the grid, the colours and the test arrangement.
#   pixi run prop all fort
kind: kit
cell: 2.0             # metres per grid cell, on every axis
colors:               # sRGB 0..255, one per surface kind
  stone: [128, 124, 116]
  wood: [112, 80, 52]
  roof: [74, 80, 92]

# The test arrangement: [piece, [i, j, k], turn]. A corner tower, a curtain wall each way
# from it with a wall-walk and battlements, a gate, a postern door, and two flights of
# stairs up to the wall-walk from inside. +x and +z are inside the fort.
test:
  - [tower_base, [0, 0, 0], 2]
  - [tower_mid, [0, 2, 0], 2]
  - [tower_top, [0, 4, 0], 2]
  # the wall running east (+x), outer side north (-z)
  - [wall, [3, 0, 0], 0]
  - [wall, [3, 1, 0], 0]
  - [wall, [4, 0, 0], 0]
  - [wall, [4, 1, 0], 0]
  - [gate, [5, 0, 0], 0]
  - [wall, [7, 0, 0], 0]
  - [wall, [7, 1, 0], 0]
  - [wall, [8, 0, 0], 0]
  - [wall, [8, 1, 0], 0]
  - [wall, [9, 0, 0], 0]
  - [wall, [9, 1, 0], 0]
  - [wall, [10, 0, 0], 0]
  - [wall, [10, 1, 0], 0]
  - [wall, [11, 0, 0], 0]
  - [wall, [11, 1, 0], 0]
  - [wall, [12, 0, 0], 0]
  - [wall, [12, 1, 0], 0]
  - [parapet, [3, 2, 0], 0]
  - [parapet, [4, 2, 0], 0]
  - [parapet, [5, 2, 0], 0]
  - [parapet, [6, 2, 0], 0]
  - [parapet, [7, 2, 0], 0]
  - [parapet, [8, 2, 0], 0]
  - [parapet, [9, 2, 0], 0]
  - [parapet, [10, 2, 0], 0]
  - [parapet, [11, 2, 0], 0]
  - [parapet_corner, [12, 2, 0], 3]
  # stairs up to the wall-walk, inside the east wall: two flights and a landing
  - [stairs, [7, 0, 1], 1]
  - [wall, [9, 0, 1], 0]
  - [wall, [10, 0, 1], 0]
  - [wall, [11, 0, 1], 0]
  - [stairs, [10, 1, 1], 1]
  - [wall, [12, 0, 1], 0]
  - [wall, [12, 1, 1], 0]
  # the wall running south (+z), outer side west (-x), with a postern door
  - [wall, [0, 0, 3], 1]
  - [wall, [0, 1, 3], 1]
  - [wall, [0, 0, 4], 1]
  - [wall, [0, 1, 4], 1]
  - [wall, [0, 0, 5], 1]
  - [wall, [0, 1, 5], 1]
  - [doorway, [0, 0, 6], 1]
  - [wall, [0, 0, 7], 1]
  - [wall, [0, 1, 7], 1]
  - [wall, [0, 0, 8], 1]
  - [wall, [0, 1, 8], 1]
  - [parapet, [0, 2, 3], 1]
  - [parapet, [0, 2, 4], 1]
  - [parapet, [0, 2, 5], 1]
  - [parapet, [0, 2, 6], 1]
  - [parapet, [0, 2, 7], 1]
  - [parapet, [0, 2, 8], 1]
