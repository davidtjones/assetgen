# The fort kit: walls, towers, gates and stairs (GAM-34), and the walls, openings and roofs
# of small buildings (GAM-49). Pieces are made by code (props/scripts/kit.py); this spec picks
# the grid, the default colours and the test arrangement.
#   pixi run prop all fort
kind: kit
cell: 2.0             # metres per grid cell, on every axis
colors:               # sRGB 0..255, the default look of each slot (a structure can give its own)
  footing: [118, 114, 106]
  wall: [128, 124, 116]
  upper: [128, 124, 116]
  frame: [112, 80, 52]
  floor: [132, 100, 66]
  roof: [74, 80, 92]
inherit:              # a slot a structure gives no material takes this slot's
  upper: wall
  footing: wall

# Small buildings beside the fort, laid out by kit.house: a barracks, a stable open on its
# front, and a hall of two storeys with stairs inside, over a ridge course (5 cells deep).
houses:
  - name: barracks
    at: [16, 0, 0]
    size: [6, 4]
    doors: [["-z", 2]]
    windows: [["-z", 1, 0], ["-z", 4, 0], ["+z", 1, 0], ["+z", 2, 0], ["+z", 3, 0], ["+z", 4, 0],
              ["-x", 1, 0], ["+x", 2, 0]]
  - name: stable
    at: [24, 0, 0]
    size: [6, 4]
    open_sides: ["-z"]
    doors: [["+x", 1, "wide"]]
    windows: [["+z", 2, 0], ["+z", 3, 0]]
  - name: hall
    at: [32, 0, 0]
    size: [6, 5]
    storeys: 2
    doors: [["-z", 2]]
    windows: [["-z", 4, 0], ["+z", 2, 0], ["+z", 3, 0], ["-z", 1, 1], ["-z", 2, 1], ["-z", 3, 1],
              ["-z", 4, 1], ["+z", 1, 1], ["+z", 4, 1], ["-x", 2, 1], ["+x", 2, 1]]
    stairs: [1, 2]

# The test arrangement: [piece, [i, j, k], turn]. A corner tower, a curtain wall each way
# from it with a wall-walk and battlements, a gate, a postern door, and two flights of
# stairs up to the wall-walk from inside. +x and +z are inside the fort.
test:
  - [tower_base, [0, 0, 0], 2]
  - [tower_mid, [0, 2, 0], 2]
  - [tower_top, [0, 4, 0], 2]
  # the wall running east (+x), outer side north (-z)
  - [wall, [3, 0, 0], 0]
  - [wall, [3, 1, 0], 0]
  - [wall, [4, 0, 0], 0]
  - [wall, [4, 1, 0], 0]
  - [gate, [5, 0, 0], 0]
  - [wall, [7, 0, 0], 0]
  - [wall, [7, 1, 0], 0]
  - [wall, [8, 0, 0], 0]
  - [wall, [8, 1, 0], 0]
  - [wall, [9, 0, 0], 0]
  - [wall, [9, 1, 0], 0]
  - [wall, [10, 0, 0], 0]
  - [wall, [10, 1, 0], 0]
  - [wall, [11, 0, 0], 0]
  - [wall, [11, 1, 0], 0]
  - [wall, [12, 0, 0], 0]
  - [wall, [12, 1, 0], 0]
  - [parapet, [3, 2, 0], 0]
  - [parapet, [4, 2, 0], 0]
  - [parapet, [5, 2, 0], 0]
  - [parapet, [6, 2, 0], 0]
  - [parapet, [7, 2, 0], 0]
  - [parapet, [8, 2, 0], 0]
  - [parapet, [9, 2, 0], 0]
  - [parapet, [10, 2, 0], 0]
  - [parapet, [11, 2, 0], 0]
  - [parapet_corner, [12, 2, 0], 3]
  # stairs up to the wall-walk, inside the east wall: two flights and a landing
  - [stairs, [7, 0, 1], 1]
  - [wall, [9, 0, 1], 0]
  - [wall, [10, 0, 1], 0]
  - [wall, [11, 0, 1], 0]
  - [stairs, [10, 1, 1], 1]
  - [wall, [12, 0, 1], 0]
  - [wall, [12, 1, 1], 0]
  # the wall running south (+z), outer side west (-x), with a postern door
  - [wall, [0, 0, 3], 1]
  - [wall, [0, 1, 3], 1]
  - [wall, [0, 0, 4], 1]
  - [wall, [0, 1, 4], 1]
  - [wall, [0, 0, 5], 1]
  - [wall, [0, 1, 5], 1]
  - [doorway, [0, 0, 6], 1]
  - [wall, [0, 0, 7], 1]
  - [wall, [0, 1, 7], 1]
  - [wall, [0, 0, 8], 1]
  - [wall, [0, 1, 8], 1]
  - [parapet, [0, 2, 3], 1]
  - [parapet, [0, 2, 4], 1]
  - [parapet, [0, 2, 5], 1]
  - [parapet, [0, 2, 6], 1]
  - [parapet, [0, 2, 7], 1]
  - [parapet, [0, 2, 8], 1]
